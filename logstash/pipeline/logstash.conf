# =============================================================================
# Logstash pipeline — devops-lab-ca
#
# Flow:
#   Filebeat (port 5044) -> JSON parse -> enrich -> Elasticsearch "app-logs-*"
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT — Beats protocol on 5044
# Filebeat opens a persistent connection; the Beats input handles multiplexing.
# -----------------------------------------------------------------------------
input {
  beats {
    port => 5044

    # Honour the client-side keep-alive so slow hosts don't get dropped.
    client_inactivity_timeout => 60
  }
}

# -----------------------------------------------------------------------------
# FILTER — parse, enrich, clean up
# -----------------------------------------------------------------------------
filter {

  # --------------------------------------------------------------------------
  # 1. Decode the JSON payload written by Winston to stdout.
  #    Filebeat ships the raw line in the "message" field.
  # --------------------------------------------------------------------------
  json {
    source  => "message"
    # Parsed keys land directly on the event root; conflicts are prefixed.
    target  => "app"
    # Don't fail the whole event if the message isn't valid JSON
    # (e.g. a startup banner or an npm warning line).
    tag_on_failure => ["_jsonparsefailure"]
  }

  # --------------------------------------------------------------------------
  # 2. If JSON parse succeeded, promote the Winston timestamp to @timestamp
  #    so Kibana's time-series view aligns with when the app logged the event,
  #    not when Filebeat shipped it.
  # --------------------------------------------------------------------------
  if "app" in [app] and [app][timestamp] {
    date {
      match   => ["[app][timestamp]", "ISO8601"]
      target  => "@timestamp"
      # Remove the raw string now that it is captured in @timestamp.
      remove_field => ["[app][timestamp]"]
    }
  }

  # --------------------------------------------------------------------------
  # 3. Promote key Winston fields to the top level so Kibana can filter on
  #    them without nesting (e.g. level:"error" rather than app.level:"error").
  # --------------------------------------------------------------------------
  if [app][level] {
    mutate {
      copy => {
        "[app][level]"          => "log_level"
        "[app][message]"        => "log_message"
        "[app][method]"         => "http_method"
        "[app][route]"          => "http_route"
        "[app][statusCode]"     => "http_status_code"
        "[app][responseTimeMs]" => "response_time_ms"
      }
    }
  }

  # --------------------------------------------------------------------------
  # 4. Tag error events so they are easy to alert on in Kibana / Watcher.
  # --------------------------------------------------------------------------
  if [log_level] == "error" {
    mutate { add_tag => ["error"] }
  }

  if [log_level] == "warn" {
    mutate { add_tag => ["warn"] }
  }

  # --------------------------------------------------------------------------
  # 5. Attach pipeline metadata so we know exactly which host and container
  #    produced the event when multiple apps share an index.
  # --------------------------------------------------------------------------
  mutate {
    add_field => {
      "pipeline_version" => "1"
      "environment"      => "${APP_ENV:production}"
    }
  }

  # --------------------------------------------------------------------------
  # 6. Strip Filebeat / ECS housekeeping fields we don't need in ES to keep
  #    documents lean and mapping clean.
  # --------------------------------------------------------------------------
  mutate {
    remove_field => [
      "agent", "ecs", "input", "tags",
      "[log][offset]", "[log][file]",
      "prospector", "beat"
    ]
  }
}

# -----------------------------------------------------------------------------
# OUTPUT — Elasticsearch
# One index per day: app-logs-YYYY.MM.DD
# -----------------------------------------------------------------------------
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"

    # Retry on transient failures (node restart, shard relocation, etc.)
    retry_on_conflict => 3

    # ILM disabled for simplicity — use a manual rollover policy in prod.
    ilm_enabled => false
  }

  # Uncomment to echo every processed event to Logstash stdout for debugging.
  # stdout { codec => rubydebug }
}
